esphome:
  name: changhong-ac
  friendly_name: Кондиционер

esp8266:
  board: esp12e  # или d1_mini / nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Резервная точка доступа на случай смены роутера
  ap:
    ssid: "Changhong-AC Fallback"
    password: "changhong1234"

captive_portal:

# Отключаем вывод логов в аппаратный UART0, чтобы не мешать обмену с платой AC
logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Подключение компонента (из локальной папки или напрямую с GitHub)
external_components:
  - source:
      type: local
      path: components
  # Или напрямую из вашего репозитория GitHub:
  # - source: github://ВАШ_НИК/ВАШ_РЕПОЗИТОРИЙ
  #   components: [changhong_ac]

uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

climate:
  - platform: changhong_ac
    name: "Кондиционер"
    uart_id: ac_uart
    update_interval: 30s
    display_switch:
      name: "Дисплей кондиционера"
    error_code:
      name: "Код ошибки кондиционера"
